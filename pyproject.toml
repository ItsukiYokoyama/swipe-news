[project]
name = "swipe-news"
version = "0.4.0"
description = "A personal news reader where you sort RSS headlines by swiping cards, with on-device genre classification"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Swipe News contributors" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Japanese",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "feedparser==6.0.11",
    "beautifulsoup4==4.12.3",
    "PyYAML==6.0.2",
    "onnxruntime==1.20.1",
    "tokenizers==0.21.0",
    "numpy==2.2.1",
]

[project.optional-dependencies]
# System tray icon (pystray is LGPL-3.0)
desktop = ["pystray==0.19.5", "Pillow==11.0.0"]
dev = ["pytest==8.3.4", "ruff==0.8.4"]

[project.gui-scripts]
swipe-news = "swipe_news.desktop:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swipe_news"]
# The model is too large for the wheel (downloaded on first use, or bundled in the Windows zip)
exclude = ["src/swipe_news/models"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.pycodestyle]
# Japanese UI strings count as double width, so allow somewhat longer lines
max-line-length = 140
